name: Build Canary Executable

on:
  push:
    branches:
      - canary

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-latest
            os-name: macOS
            ext: ""
          - os: windows-latest
            os-name: Windows
            ext: ".exe"
          - os: ubuntu-latest
            os-name: Linux
            ext: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: bun install

      - name: Generate Canary Build Metadata
        id: metadata
        shell: bash
        run: |
          BUILD_NUM="${{ github.run_number }}"
          CANARY_VERSION="build.${BUILD_NUM}"
          LABEL="novelty-${{ matrix.os-name }}-Canary-${CANARY_VERSION}"
          # Set both step output and env var correctly
          echo "canary_version=${CANARY_VERSION}" >> $GITHUB_OUTPUT
          echo "artifact_label=${LABEL}" >> $GITHUB_OUTPUT
          echo "CANARY_VERSION=${CANARY_VERSION}" >> $GITHUB_ENV
          echo "ARTIFACT_LABEL=${LABEL}" >> $GITHUB_ENV
          echo "Generated Canary Label: $LABEL"
      - name: Build Executable
        env:
          VITE_CANARY_BUILD_LABEL: ${{ steps.metadata.outputs.artifact_label }}
        run: bun run build:canary

      - name: Prepare Canary Release Artifacts
        shell: bash
        env:
          ARTIFACT_LABEL: ${{ steps.metadata.outputs.artifact_label }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p release-output

          # Find and copy installer or zip/tarball/exe artifacts generated by Electrobun recursively from build/
          find build -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.tar.zst" -o -name "*.zip" \) -exec cp {} release-output/ \;

          # Rename files to include the unique artifact label
          for file in release-output/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              # Avoid renaming if it already has the label
              if [[ "$filename" != *"${{ steps.metadata.outputs.artifact_label }}"* ]]; then
                extension="${filename#*.}"
                # Handle extensions safely
                if [[ "$filename" == *.tar.zst ]]; then
                  mv "$file" "release-output/${{ steps.metadata.outputs.artifact_label }}.tar.zst"
                elif [[ "$filename" == *.exe ]]; then
                  mv "$file" "release-output/${{ steps.metadata.outputs.artifact_label }}.exe"
                else
                  mv "$file" "release-output/${{ steps.metadata.outputs.artifact_label }}.$extension"
                fi
              fi
            fi
          done

          echo "Files prepared for release:"
          ls -la release-output/

      - name: Upload Canary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_label }}
          path: release-output/
          if-no-files-found: warn

      # - name: Delete Older Canary Releases
      #   uses: dev-drprasad/delete-older-releases@v3
      #   with:
      #     keep_latest: 3
      #     delete_tags: true
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: canary-build-${{ github.run_number }}
          name: "Novelty Canary Build #${{ github.run_number }}"
          body: "Automated canary build from commit `${{ github.sha }}` for build run #${{ github.run_number }}."
          prerelease: true
          files: release-output/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
